<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#087e68" />
  <title>Admin | Car Loan MY</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=20260930" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260930" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <main class="admin-shell">
    <header class="topbar"><img class="app-logo" src="/icon-192.png?v=20260930" width="52" height="52" alt="Car Loan MY" /><div><p class="eyebrow">ADMIN</p><h1>Car Loan MY</h1></div><button id="logoutButton" class="icon-button" title="Logout" aria-label="Logout" hidden><i data-lucide="log-out"></i></button></header>
    <p id="adminStatus" class="admin-status" role="status" aria-live="polite"></p>
    <section id="loginSection">
      <h2>Login admin</h2><p class="admin-subtitle">Link login dihantar ke email admin yang berdaftar.</p>
      <form id="loginForm"><label><span>Email admin</span><input id="adminEmail" type="email" autocomplete="email" required placeholder="Email admin" /></label><button type="submit" class="primary-action"><i data-lucide="mail"></i> Hantar link login</button></form>
    </section>
    <section id="adminDashboard" hidden>
      <div class="admin-section-heading"><div><h2>Hebahan</h2><p id="adminIdentity" class="admin-subtitle"></p></div><button id="refreshButton" class="icon-button" title="Refresh" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button></div>
      <div class="admin-workspace">
        <form id="announcementForm">
          <h3>Hebahan baharu</h3>
          <label><span>Tajuk</span><input id="announcementTitle" maxlength="100" required /></label>
          <label><span>Mesej</span><textarea id="announcementMessage" maxlength="1500" required></textarea></label>
          <label><span>Link butang (optional)</span><input id="announcementLink" type="url" placeholder="https://" /></label>
          <label><span>Nama butang</span><input id="announcementLabel" maxlength="50" placeholder="Buka link" /></label>
          <p class="admin-subtitle">Hebahan baharu menggantikan popup aktif. Notification dihantar secara berasingan.</p>
          <div class="admin-form-actions"><button id="previewButton" type="button" class="secondary-action"><i data-lucide="eye"></i> Preview</button><button type="submit" class="primary-action"><i data-lucide="megaphone"></i> Terbitkan popup</button></div>
        </form>
        <section aria-label="Senarai hebahan"><h3>Rekod hebahan</h3><div id="announcementList"></div></section>
      </div>
    </section>
  </main>
  <dialog id="adminDialog" class="app-dialog" aria-labelledby="adminDialogTitle">
    <div class="dialog-top"><img src="/icon-192.png?v=20260930" width="56" height="56" alt="" /><button id="adminDialogClose" class="icon-button" title="Tutup" aria-label="Tutup"><i data-lucide="x"></i></button></div>
    <p class="dialog-kicker">CAR LOAN MY</p><h2 id="adminDialogTitle"></h2><p id="adminDialogMessage"></p>
    <a id="previewLink" class="primary-action" target="_blank" rel="noopener noreferrer" hidden></a>
    <button id="confirmSend" class="primary-action" hidden><i data-lucide="send"></i> Hantar notification</button>
  </dialog>
  <script src="/assets/vendor/lucide.js"></script><script src="/admin.js"></script>
</body>
</html>
